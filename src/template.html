<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />
    <meta name="theme-color" content="#1B4DFF" />

    <!-- Favicon -->
    <link rel="icon" href="./assets/images/logos/company-tab.svg" />
    <link rel="apple-touch-icon" href="./assets/images/logos/company-tab.svg" />

    <!-- Preload key resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

    <!-- Stylesheets -->
    <link href="./output.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Lumira | Homepage</title>
  </head>
  <body class="bg-gray-400">
    <div class="price-range flex flex-col gap-3">
      <button type="button" data-expand="Price-Range-J" class="flex cursor-pointer items-center justify-between px-2">
        <h5 class="text-Lumira-Gray-900 font-medium">Price</h5>
        <svg class="-rotate-180 transition-all duration-300" width="17" height="16" viewBox="0 0 17 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3.16675 5.3335L8.50008 10.6668L13.8334 5.3335" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      </button>
      <div id="Price-Range-J" class="bg-Lumira-Gray-200 rounded-xl p-[6px]">
        <div class="price-range grid grid-cols-2 gap-1">
          <label class="price-range-inputs border-Lumira-Gray-200 focus-within:border-Lumira-Rose-600 flex items-center gap-1 rounded-lg border bg-white px-[14px] py-3 transition-all duration-300">
            <p class="text-Lumira-Gray-900 text-sm leading-[20px] font-medium">IDR</p>
            <input type="number" class="min-price placeholder:text-Lumira-Gray-500 text-Lumira-Gray-900 h-full w-full text-sm leading-[20px] font-medium placeholder:text-base placeholder:font-normal focus:outline-none" placeholder="minimum" />
          </label>
          <label class="price-range-inputs border-Lumira-Gray-200 focus-within:border-Lumira-Rose-600 flex items-center gap-1 rounded-lg border bg-white px-[14px] py-3 transition-all duration-300">
            <p class="text-Lumira-Gray-900 text-sm leading-[20px] font-medium">IDR</p>
            <input type="number" class="max-price placeholder:text-Lumira-Gray-500 text-Lumira-Gray-900 h-full w-full text-sm leading-[20px] font-medium placeholder:text-base placeholder:font-normal focus:outline-none" placeholder="maximum" />
          </label>
        </div>
      </div>
    </div>

    <!-- Third-party Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Application Scripts -->
    <script src="js/dropdown-jquery-mobile.js"></script>
    <script src="js/mobile-modal-category.js"></script>
    <script src="js/mobile-modal-filter.js"></script>
    <script src="js/modal-input-navbar-top-clear-input-value.js"></script>
    <script src="js/modal-input-navbar-top-toggle.js"></script>
    <script src="js/menu-dropdown-all.js"></script>
    <script src="js/swiper.js"></script>
    <script src="js/format-currency.js"></script>
    <script src="js/nav-top-dark.js"></script>
    <script src="js/browse-all-tabs.js"></script>
    <script src="js/browse-all-horizontal-scroll.js"></script>
  </body>
</html>
